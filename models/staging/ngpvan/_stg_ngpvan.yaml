        description: Date record in table was created
      - name: staticfullname
        description:
          Name of the code. Codes can apply to many items in Votebuilder, like
          Organizations, Events and Locations. Not to be confused with Activist Codes,
          which only apply to individuals. They give users a lot more flexibility to create
          custom groupings of information, and are similar to hashtags in that respect.
      - name: codetypeid
        description: Source Code vs Tag
      - name: codedescription
        description: System stores description of code for reference purposes
      - name: contacttypeid
        description: Unique ID of Type of Contact
      - name: campaignid
        description: Unique ID of Campain (if applied)
