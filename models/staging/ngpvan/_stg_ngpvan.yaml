        description: Unique ID for Code
      - name: codename
        description: Code Name in VAN
      - name: committeeid
        description: Committee in which record lives
      - name: isactive
        description: A Flag for if the activity is active
      - name: parentcodeid
        description:
          If the Code is in a nested structure, this will be the direct parent
          of the Code
